<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Gestão de Negócios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="text-center fw-bold text-primary mb-2">Gestão de Negócios</h3>
                        <p class="text-center text-muted mb-4">Acesso ao Sistema — MVP Fatia Vertical</p>
                        <form action="dashboard.html" method="get">
                            <div class="mb-3">
                                <label for="login" class="form-label">Usuário</label>
                                <input type="text" id="login" class="form-control" value="operador.vendas" required>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" id="senha" class="form-control" value="123456" required>
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <a href="dashboard.html" class="btn btn-primary btn-lg">Entrar no Sistema</a>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-white text-center text-muted small py-3">
                        UFT — Ciência da Computação | Equipe: Dheimerson Sousa Leal &amp; Dhiogo Carneiro
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
